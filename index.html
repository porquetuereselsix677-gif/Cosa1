<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mochi VTuber Mic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14121d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .stage {
      position: relative;
      width: min(85vw, 420px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mochi {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.08s ease-out;
      pointer-events: none;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 92vw;
      z-index: 10;
    }
    button {
      background: #2a2540;
      color: #fff;
      border: 1px solid #4c4375;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.active {
      background: #7c4dff;
      border-color: #b388ff;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img id="mochi" src="ojos-normal_boca-normal.png" alt="Mochi" />
  </div>

  <div class="controls">
    <button class="active" data-mood="normal">Normal</button>
    <button data-mood="brillantes">Brillantes</button>
    <button data-mood="feliz">Feliz</button>
    <button data-mood="relajado">Relajado</button>
    <button data-mood="enojado">Enojado</button>
    <button data-mood="triste">Triste</button>
    <button data-mood="enamorado">Enamorado</button>
  </div>
  <div id="status" class="status">Micrófono desactivado. Toca en cualquier parte para iniciar.</div>

  <script>
    const mochi = document.getElementById("mochi");
    const statusDiv = document.getElementById("status");
    const moodButtons = document.querySelectorAll("[data-mood]");

    let mood = "normal";
    let mouthOpen = false;
    let blinking = false;
    let recognition = null;
    let silenceTimer = null;

    const mapSprites = {
      normal: {
        closed: "ojos-normal_boca-normal.png",
        open: "ojos-normal_boca-abierta.png"
      },
      brillantes: {
        closed: "ojos-brillantes_boca-cerrada.png",
        open: "ojos-brillantes_boca-abierta.png"
      },
      feliz: {
        closed: "ojos-feliz_boca-cerrada.png",
        open: "ojos-feliz_boca-abierta.png"
      },
      relajado: {
        closed: "ojos-relajado_boca-cerrada.png",
        open: "ojos-relajado_boca-abierta.png"
      },
      enojado: {
        closed: "ojos-enojado_boca-cerrada.png",
        open: "ojos-enojado_boca-abierta.png"
      },
      triste: {
        closed: "ojos-triste_boca-cerrada.png",
        open: "ojos-triste_boca-abierta.png"
      },
      enamorado: {
        closed: "ojos-enamorado_boca-cerrada.png",
        open: "ojos-enamorado_boca-abierta.png"
      }
    };

    function updateSprite() {
      if (blinking) {
        mochi.src = mouthOpen ? "parpadeo_boca-abierta.png" : "parpadeo_boca-cerrada.png";
        return;
      }
      const pair = mapSprites[mood] || mapSprites.normal;
      mochi.src = mouthOpen ? pair.open : pair.closed;
    }

    function setMouth(open) {
      if (mouthOpen !== open) {
        mouthOpen = open;
        updateSprite();
      }
      clearTimeout(silenceTimer);
      if (open) {
        silenceTimer = setTimeout(() => {
          setMouth(false);
        }, 500);
      }
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusDiv.textContent = "El navegador no soporta reconocimiento de voz.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "es-ES";

      recognition.onstart = () => {
        statusDiv.textContent = "Micrófono escuchando...";
      };

      recognition.onresult = (event) => {
        let hasText = false;
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i][0].transcript.trim().length > 0) {
            hasText = true;
            break;
          }
        }
        setMouth(hasText);
      };

      recognition.onerror = (event) => {
        console.error("Error de voz:", event.error);
      };

      recognition.onend = () => {
        try {
          recognition.start();
        } catch (e) {
          statusDiv.textContent = "Toca la pantalla para reactivar el micro.";
        }
      };

      try {
        recognition.start();
      } catch (e) {
        statusDiv.textContent = "Toca la pantalla para activar el micrófono.";
      }
    }

    function moveWithPointer(clientX, clientY) {
      const nx = (clientX / window.innerWidth - 0.5) * 2;
      const ny = (clientY / window.innerHeight - 0.5) * 2;
      const moveX = nx * 22;
      const moveY = ny * 14;
      const tilt = nx * 8;
      mochi.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${tilt}deg)`;
    }

    window.addEventListener("pointermove", (e) => {
      moveWithPointer(e.clientX, e.clientY);
    });

    window.addEventListener("pointerdown", (e) => {
      moveWithPointer(e.clientX, e.clientY);
      if (!recognition) {
        initSpeech();
      }
    });

    moodButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        moodButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        mood = btn.dataset.mood;
        updateSprite();
      });
    });

    setInterval(() => {
      blinking = true;
      updateSprite();
      setTimeout(() => {
        blinking = false;
        updateSprite();
      }, 160);
    }, 3500);

    updateSprite();
  </script>
</body>
</html>
